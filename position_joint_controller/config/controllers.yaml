# Real-robot configuration for PositionJointController.
# Passed via --param-file to the spawner. The spawner reads
# position_joint_controller.ros__parameters.type and sets it on the
# controller_manager before calling load_controller.

position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController
    robot_type: 'tiago_pro'
    arm_prefix: ''
    filter_coeff: 1.0  # IIR coefficient [0,1]: 1.0=no filter, 0.0=hold
    publish_rate: 100.0  # Hz: max rate at which commands are written to hardware (TriggerRate)
    position_limits_lower: [-4.7123, -2.4434, -2.6179, -2.4434, -1.5708, -1.8849, -2.6179]  # rad, TiagoPro
    position_limits_upper: [0.5235, 1.1344, 2.6179, 1.1344, 3.6651, 3.0019, 2.6179]  # rad, TiagoPro
