# Gazebo configuration for PositionJointController.
# Passed via --param-file to the spawner in the Gazebo launch file.
# The position command interface is always available in Gazebo
# (gazebo_effort:=true is NOT required).

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz


joint_state_broadcaster:
  ros__parameters:
    update_rate: 500  # Hz
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
    interfaces:  
      - position
    type: joint_state_broadcaster/JointStateBroadcaster

position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController  # required: spawner reads type from here
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_left'
    command_interfaces:
      - position
    state_interfaces:
      - position
    filter_coeff: 1.0  # IIR coefficient [0,1]: 1.0=no filter, 0.0=hold
    update_rate: 10  # Hz: max rate at which commands are written to hardware (TriggerRate)
    position_limits_lower: [-4.7123, -2.4434, -2.6179, -2.4434, -1.5708, -1.8849, -2.6179]  # rad, TiagoPro
    position_limits_upper: [0.5235, 1.1344, 2.6179, 1.1344, 3.6651, 3.0019, 2.6179]  # rad, TiagoPro
