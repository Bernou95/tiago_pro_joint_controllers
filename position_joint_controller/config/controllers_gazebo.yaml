# Gazebo configuration for PositionJointController.
# Passed via --param-file to the spawner in the Gazebo launch file.
# The position command interface is always available in Gazebo
# (gazebo_effort:=true is NOT required).

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0  # Hz

    position_joint_controller:
      type: position_joint_controller/PositionJointController

position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController  # required: spawner reads type from here
    robot_type: 'tiago_pro'
    arm_prefix: ''
    filter_coeff: 1.0  # IIR coefficient [0,1]: 1.0=no filter, 0.0=hold
    publish_rate: 100.0  # Hz: max rate at which commands are written to hardware (TriggerRate)
    position_limits_lower: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]  # rad, TiagoPro
    position_limits_upper: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]  # rad, TiagoPro
