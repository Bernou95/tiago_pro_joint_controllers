# Gazebo configuration for PositionJointController — dual arm (left + right).
# Passed via --param-file to the spawner in the Gazebo launch file.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

joint_state_broadcaster:
  ros__parameters:
    update_rate: 500  # Hz
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
    interfaces:
      - position
    type: joint_state_broadcaster/JointStateBroadcaster

# ── LEFT ARM ─────────────────────────────────────────────────────────────────

arm_left_position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController
    arm_prefix: 'arm_left'
    command_interfaces:
      - position
    state_interfaces:
      - position
    filter_coeff: 1.0
    update_rate: 100  # Hz
    position_limits_lower: [-0.5235, -2.4434, -2.6179, -2.4434, -3.6651, -1.8849, -2.6179]  # rad, TiagoPro
    position_limits_upper: [4.7123, 1.1344, 2.6179, 1.1344, 1.5708, 3.0019, 2.6179]  # rad, TiagoPro

# ── RIGHT ARM ────────────────────────────────────────────────────────────────

arm_right_position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController
    arm_prefix: 'arm_right'
    command_interfaces:
      - position
    state_interfaces:
      - position
    filter_coeff: 1.0
    update_rate: 100  # Hz
    position_limits_lower: [-4.7123, -2.4434, -2.6179, -2.4434, -1.5708, -1.8849, -2.6179]
    position_limits_upper: [0.5235, 1.1344, 2.6179, 1.1344, 3.6651, 3.0019, 2.6179]
