# Real-robot configuration for VelocityJointController — right arm.
# Passed via --param-file to the spawner.

arm_right_velocity_joint_controller:
  ros__parameters:
    type: velocity_joint_controller/VelocityJointController
    arm_prefix: 'arm_right'
    filter_coeff: 1.0
    publish_rate: 200.0
    velocity_limits: [1.95, 1.95, 3.95, 3.95, 3.95, 3.95, 3.95]  # rad/s, TiagoPro
