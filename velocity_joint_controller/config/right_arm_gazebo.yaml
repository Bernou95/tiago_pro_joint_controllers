# Gazebo configuration for VelocityJointController — right arm only.
# Passed via --param-file to the spawner in the Gazebo launch file.
# The velocity command interface is always available in Gazebo.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

joint_state_broadcaster:
  ros__parameters:
    update_rate: 500  # Hz
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
    interfaces:
      - position
    type: joint_state_broadcaster/JointStateBroadcaster

arm_right_velocity_joint_controller:
  ros__parameters:
    type: velocity_joint_controller/VelocityJointController
    arm_prefix: 'arm_right'
    filter_coeff: 1.0     # IIR coefficient [0,1]: 1.0=no filter, 0.0=hold
    publish_rate: 500.0   # Hz
    velocity_limits: [1.95, 1.95, 3.95, 3.95, 3.95, 3.95, 3.95]  # rad/s, TiagoPro
