# Gazebo configuration for VelocityJointController.
# Passed via --param-file to the spawner in the Gazebo launch file.
# The velocity command interface is always available in Gazebo
# (gazebo_effort:=true is NOT required).

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0  # Hz

    velocity_joint_controller:
      type: velocity_joint_controller/VelocityJointController

velocity_joint_controller:
  ros__parameters:
    type: velocity_joint_controller/VelocityJointController  # required: spawner reads type from here
    robot_type: 'tiago_pro'
    arm_prefix: ''
    filter_coeff: 1.0  # IIR coefficient [0,1]: 1.0=no filter, 0.0=hold
    publish_rate: 500.0  # Hz: max rate at which commands are written to hardware (TriggerRate)
    velocity_limits: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]  # rad/s, TiagoPro
