# Real-robot configuration for EffortJointController — right arm.
# Passed via --param-file to the spawner.

arm_right_effort_joint_controller:
  ros__parameters:
    type: effort_joint_controller/EffortJointController
    arm_prefix: 'arm_right'
    effort_limits: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]  # N*m, TiagoPro per-joint limits
    delta_tau_max: 1.0
    publish_rate: 500.0
