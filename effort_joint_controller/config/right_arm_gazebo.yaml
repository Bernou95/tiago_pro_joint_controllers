# Gazebo configuration for EffortJointController — right arm only.
# Passed via --param-file to the spawner in the Gazebo launch file.
# The effort command interface in Gazebo requires gazebo_effort:=true in the xacro.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

joint_state_broadcaster:
  ros__parameters:
    update_rate: 500  # Hz
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
    interfaces:
      - position
    type: joint_state_broadcaster/JointStateBroadcaster

arm_right_effort_joint_controller:
  ros__parameters:
    type: effort_joint_controller/EffortJointController
    arm_prefix: 'arm_right'
    command_interfaces:
      - effort
    state_interfaces:
      - effort
    effort_limits: [43.0, 43.0, 26.0, 26.0, 26.0, 26.0, 26.0]  # N*m, Gazebo limits
    delta_tau_max: 1.0   # N*m/cycle max torque rate
    publish_rate: 500.0  # Hz
