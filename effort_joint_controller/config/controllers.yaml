# Real-robot configuration for EffortJointController.
# Passed via --param-file to the spawner. The spawner reads
# effort_joint_controller.ros__parameters.type and sets it on the
# controller_manager before calling load_controller.

effort_joint_controller:
  ros__parameters:
    type: effort_joint_controller/EffortJointController
    robot_type: 'tiago_pro'
    arm_prefix: ''
    effort_limits: [43.0, 43.0, 26.0, 26.0, 26.0, 26.0, 26.0]  # N*m, TiagoPro per-joint limits
    delta_tau_max: 1.0  # N*m/cycle max torque rate
    publish_rate: 500.0  # Hz: max rate at which torque commands are written to hardware (TriggerRate)
