    effort_controller_name: arm_right_effort_joint_controller
    gravity_compensation_controller_name: arm_right_gravity_compensation_controller
    default_mode: 3  # gravity_compensation — matches the controller spawned active
    # PAL's own arm_right_controller (JointTrajectoryController, from
    # tiago_pro_controller_configuration's default_controllers module) claims the same
    # `position` command interface and is active by default. Only switching to position
    # mode conflicts with it, so it's only folded into that one switch_controller call.
    pal_arm_controller_name: arm_right_controller
    command_timeout: 0.5
    switch_overlap_duration: 0.3
    controller_manager_topic: /controller_manager
    effort_commands_topic: /arm_right_effort_joint_controller/commands
    velocity_commands_topic: /arm_right_velocity_joint_controller/commands
