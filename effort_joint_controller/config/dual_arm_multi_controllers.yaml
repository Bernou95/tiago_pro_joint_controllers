# Dual-arm multi-controller configuration for the real robot.
# Passed via --param-file to the spawner alongside multi_controller_real_robot.launch.py.
#
# Unlike the Gazebo Classic multi-controller yaml, this file has no
# `controller_manager:` block and no `joint_state_broadcaster:` entry — on the
# real robot both are already brought up by PAL's own system modules
# (tiago_pro_controller_configuration's `default_controllers`) before this
# module runs.
#
# Default active mode per arm is gravity_compensation (see default_mode below,
# and the `arm_{side}_gravity_compensation_controller` spawned active by
# multi_controller_real_robot.launch.py). position/velocity/effort are loaded
# inactive; switch between them at runtime by publishing std_msgs/Int32 to
# each arm's motion_controller_interface, never by editing this file:
#   ros2 topic pub --once /arm_left_motion_controller_interface/set_mode  \
#       std_msgs/msg/Int32 "{data: 1}"
#   ros2 topic pub --once /arm_right_motion_controller_interface/set_mode \
#       std_msgs/msg/Int32 "{data: 1}"
# (0=position  1=effort  2=velocity  3=gravity_compensation)
#
# PAL's `default_controllers` module (base/torso/head/arms) is left running —
# it does not need to be disabled. Its arm_{side}_controller only conflicts
# with our position mode (both claim the `position` command interface);
# effort, velocity, and gravity_compensation modes never conflict with it.
# The pal_arm_controller_name parameter below tells motion_controller_interface
# to release that one claim atomically whenever position mode is requested.

# ── LEFT ARM ────────────────────────────────────────────────────────────────

arm_left_position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_left'
    command_interfaces:
      - position
    state_interfaces:
      - position
    filter_coeff: 1.0
    update_rate: 100  # Hz
    position_limits_lower: [-0.5235, -2.4434, -2.6179, -2.4434, -3.6651, -1.8849, -2.6179]  # rad, TiagoPro
    position_limits_upper: [4.7123, 1.1344, 2.6179, 1.1344, 1.5708, 3.0019, 2.6179]  # rad, TiagoPro

arm_left_velocity_joint_controller:
  ros__parameters:
    type: velocity_joint_controller/VelocityJointController
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_left'
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
    filter_coeff: 1.0
    publish_rate: 200.0  # Hz
    velocity_limits: [1.95, 1.95, 3.95, 3.95, 3.95, 3.95, 3.95]  # rad/s

arm_left_effort_joint_controller:
  ros__parameters:
    type: effort_joint_controller/EffortJointController
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_left'
    command_interfaces:
      - effort
    state_interfaces:
      - effort
    effort_limits: [43.0, 43.0, 26.0, 26.0, 26.0, 26.0, 26.0]  # N*m, TiagoPro per-joint limits
    delta_tau_max: 1.0
    publish_rate: 500.0  # Hz
    use_gravity_compensation: false
    gravity_compensation_topic: ''

arm_left_motion_controller_interface:
  ros__parameters:
    type: motion_controller_interface/MotionControllerInterface
    position_controller_name: arm_left_position_joint_controller
    velocity_controller_name: arm_left_velocity_joint_controller
    effort_controller_name: arm_left_effort_joint_controller
    gravity_compensation_controller_name: arm_left_gravity_compensation_controller
    default_mode: 3  # gravity_compensation — matches the controller spawned active
    # PAL's own arm_left_controller (JointTrajectoryController, from
    # tiago_pro_controller_configuration's default_controllers module) claims the same
    # `position` command interface and is active by default. Only switching to position
    # mode conflicts with it, so it's only folded into that one switch_controller call.
    pal_arm_controller_name: arm_left_controller
    command_timeout: 0.5
    switch_overlap_duration: 0.3
    controller_manager_topic: /controller_manager
    effort_commands_topic: /arm_left_effort_joint_controller/commands
    velocity_commands_topic: /arm_left_velocity_joint_controller/commands

# ── RIGHT ARM ───────────────────────────────────────────────────────────────

arm_right_position_joint_controller:
  ros__parameters:
    type: position_joint_controller/PositionJointController
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_right'
    command_interfaces:
      - position
    state_interfaces:
      - position
    filter_coeff: 1.0
    update_rate: 100  # Hz
    position_limits_lower: [-4.7123, -2.4434, -2.6179, -2.4434, -1.5708, -1.8849, -2.6179]
    position_limits_upper: [0.5235, 1.1344, 2.6179, 1.1344, 3.6651, 3.0019, 2.6179]

arm_right_velocity_joint_controller:
  ros__parameters:
    type: velocity_joint_controller/VelocityJointController
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_right'
