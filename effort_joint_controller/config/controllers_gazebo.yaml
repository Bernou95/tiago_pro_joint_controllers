# Gazebo configuration for EffortJointController.
# Passed via --param-file to the spawner in the Gazebo launch file.
# The effort command interface in Gazebo requires gazebo_effort:=true in the xacro.

#controller_manager:
#  ros__parameters:
#    update_rate: 1000  # Hz
#
#    joint_state_broadcaster:
#      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    update_rate: 100.0  # Hz
    type: joint_state_broadcaster/JointStateBroadcaster
#
#    effort_joint_controller:
#      type: effort_joint_controller/EffortJointController

effort_joint_controller:
  ros__parameters:
    type: effort_joint_controller/EffortJointController  # required: spawner reads type from here
    robot_type: 'tiago_pro'
    arm_prefix: 'arm_left'
    joints:
      - ${ARM_SIDE_PREFIX}_1_joint
      - ${ARM_SIDE_PREFIX}_2_joint
      - ${ARM_SIDE_PREFIX}_3_joint
      - ${ARM_SIDE_PREFIX}_4_joint
      - ${ARM_SIDE_PREFIX}_5_joint
      - ${ARM_SIDE_PREFIX}_6_joint
      - ${ARM_SIDE_PREFIX}_7_joint
    command_interfaces:
      - effort
    state_interfaces:
      - effort

    effort_limits: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]  # N*m, TiagoPro per-joint limits
    delta_tau_max: 1.0  # N*m/cycle max torque rate
    publish_rate: 500.0  # Hz: max rate at which torque commands are written to hardware (TriggerRate)
